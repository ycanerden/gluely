<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gluely Studio</title>
<style>
@font-face { font-family: "Jersey 20"; src: url("/fonts/jersey20.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("/fonts/atkinson.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
:root {
  --bg: #ffffff; --side: #fafafa; --canvas: #f7f7f8; --dot: #e3e3e8; --card: #ffffff;
  --ink: #18181b; --body: #3f3f46; --quiet: #71717a; --faint: #a1a1aa; --rule: #e7e7ea; --hover: #f2f2f4; --sel: #ececf0;
  --sky: #4a58cf; --sky-wash: #eef0fd; --ring: rgba(74, 88, 207, .18);
  --route: #c2560c; --route-wash: #fff8f1; --route-rule: #f6c79c;
  --ok: #15803d; --ok-wash: #ecfdf3; --no: #be123c; --no-wash: #fff1f3; --wait: #b45309; --wait-wash: #fffbeb;
  --shadow: 0 1px 2px rgba(24, 24, 27, .05);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #121016; --side: #15131a; --canvas: #18161d; --dot: #2a2731; --card: #1e1b24;
  --ink: #f4f4f5; --body: #d4d4d8; --quiet: #a1a1aa; --faint: #71717a; --rule: #2e2b35; --hover: #24212b; --sel: #2b2833;
  --sky: #9aa5ff; --sky-wash: #232542; --ring: rgba(154, 165, 255, .22);
  --route: #fdba74; --route-wash: #261d16; --route-rule: #6b4424;
  --ok: #4ade80; --ok-wash: #14271c; --no: #fb7185; --no-wash: #2c161c; --wait: #fbbf24; --wait-wash: #2a2213;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--body); font: 13.5px/1.45 "Atkinson Hyperlegible Next", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.mono { font-family: var(--mono); }

.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
.app.inspect { grid-template-columns: 232px 1fr 340px; }

/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.ws { display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px; }
.logo { width: 24px; height: 24px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 17px/1 "Jersey 20", sans-serif; }
.ws b { color: var(--ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { padding: 4px 8px 12px; overflow: auto; flex: 1; }
.label { padding: 14px 8px 5px; font-size: 11.5px; color: var(--faint); }
.item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; color: var(--body); }
.item:hover { background: var(--hover); }
.item.on { background: var(--sel); color: var(--ink); font-weight: 500; }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { color: var(--faint); font-size: 11.5px; }
.glyph { width: 14px; height: 14px; flex: none; color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.ok { background: var(--ok); } .dot.wait { background: var(--wait); } .dot.no { background: var(--no); } .dot.run { background: var(--sky); }
.foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rule); color: var(--quiet); font-size: 12.5px; }
.foot .dot { background: var(--ok); }
.foot.off .dot { background: var(--no); }
.foot button { margin-left: auto; color: var(--faint); padding: 2px 6px; border-radius: 5px; }
.foot button:hover { background: var(--hover); color: var(--ink); }

/* main */
.main { display: grid; grid-template-rows: 48px 1fr 6px var(--grid, 38%); min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--rule); min-width: 0; }
.crumb { color: var(--quiet); white-space: nowrap; }
.crumb b { color: var(--ink); font-weight: 500; }
.sep { color: var(--faint); }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 7px; background: var(--card); color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn small { color: var(--faint); }
select.btn { padding-right: 6px; max-width: 260px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11.5px; white-space: nowrap; background: var(--hover); color: var(--quiet); }
.pill.ok { background: var(--ok-wash); color: var(--ok); } .pill.no { background: var(--no-wash); color: var(--no); }
.pill.wait { background: var(--wait-wash); color: var(--wait); } .pill.sky { background: var(--sky-wash); color: var(--sky); }
.waitbar { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 10px; border-radius: 7px; background: var(--wait-wash); color: var(--wait); white-space: nowrap; overflow: hidden; }
.waitbar code { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 7px; }

/* canvas */
.canvas { position: relative; overflow: hidden; min-height: 0; }
.scroller { position: absolute; inset: 0; overflow: auto; background: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 16px 16px; min-height: 0; }
.stage { padding: 28px 40px 70px; transform-origin: top center; display: flex; justify-content: center; min-width: max-content; }
.col { display: flex; flex-direction: column; align-items: center; }
.node { width: 232px; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 7px 9px 8px; transition: border-color .12s, box-shadow .12s; }
.node:hover { border-color: var(--faint); }
.node.sel { border-color: var(--sky); box-shadow: 0 0 0 3px var(--ring); }
.node.here { border-color: var(--wait); box-shadow: 0 0 0 3px var(--wait-wash); }
.node.dim { opacity: .5; }
.nh { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.nh .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nh .n { margin-left: auto; }
.nh svg { width: 11px; height: 11px; flex: none; shape-rendering: crispEdges; }
.nt { margin-top: 3px; color: var(--ink); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ns { color: var(--quiet); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nf { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.nf .pill { height: 18px; font-size: 11px; }
.sends { color: var(--no); }
.edge { position: relative; width: 1px; height: 30px; background: var(--faint); opacity: .7; }
.edge.arrow::after { content: ""; position: absolute; bottom: -1px; left: -3px; border: 3.5px solid transparent; border-top: 4px solid var(--faint); border-bottom: 0; }
.edge .lab { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.edge .lab .pill { background: var(--card); border: 1px solid var(--rule); color: var(--quiet); height: 19px; }
.edge .drop { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); }
.edge.tall { height: 40px; }

.router { background: var(--route-wash); border: 1px dashed var(--route-rule); border-radius: 12px; padding: 8px 12px 12px; display: flex; flex-direction: column; align-items: center; }
.rh { align-self: stretch; display: flex; align-items: center; gap: 8px; padding: 0 2px 4px; }
.rh .name { color: var(--route); font-weight: 500; font-size: 13px; cursor: pointer; }
.rh .name:hover { text-decoration: underline; }
.rh .pill { background: var(--card); color: var(--route); border: 1px solid var(--route-rule); }
.router.sel { box-shadow: 0 0 0 3px var(--ring); border-color: var(--sky); }
.paths { display: grid; grid-auto-flow: column; grid-auto-columns: 256px; position: relative; }
.paths::before, .paths::after { content: ""; position: absolute; height: 1px; background: var(--faint); opacity: .7; left: calc(100% / var(--n) / 2); right: calc(100% / var(--n) / 2); }
.paths::before { top: 0; } .paths::after { bottom: 0; }
.paths.one::before, .paths.one::after { display: none; }
.path { display: flex; flex-direction: column; align-items: center; padding: 0 12px; }
.path .grow { flex: 1; width: 1px; background: var(--faint); opacity: .7; min-height: 18px; }
.when { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin: 3px 0 0; max-width: 220px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plabel .pill { background: var(--card); border: 1px solid var(--route-rule); color: var(--route); }
.end { width: 160px; text-align: center; border: 1px solid var(--rule); background: var(--card); border-radius: 8px; padding: 6px 8px; color: var(--quiet); font-size: 12px; box-shadow: var(--shadow); }
.end b { color: var(--ink); font-weight: 500; }

.zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); z-index: 2; }
.zoom button { width: 28px; height: 26px; border-radius: 6px; color: var(--quiet); font-size: 14px; }
.zoom button:hover { background: var(--hover); color: var(--ink); }
.empty { margin: 60px auto; max-width: 460px; text-align: center; color: var(--quiet); }
.empty h2 { color: var(--ink); font-size: 16px; font-weight: 600; margin: 0 0 6px; }
.empty pre { text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; color: var(--ink); font: 12px/1.5 var(--mono); overflow: auto; }

/* splitter + grid */
.split { background: var(--bg); border-top: 1px solid var(--rule); cursor: row-resize; }
.split:hover { background: var(--sky-wash); }
.grid { display: grid; grid-template-rows: 40px 1fr 38px; min-height: 0; background: var(--bg); }
.gbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--rule); }
.gbar input { height: 28px; border: 1px solid var(--rule); border-radius: 7px; padding: 0 9px; background: var(--card); color: var(--ink); font: inherit; width: 200px; }
.gbar .count { color: var(--quiet); }
.chipx { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 9px; border-radius: 7px; background: var(--sky-wash); color: var(--sky); }
.chipx button { width: 18px; height: 18px; border-radius: 4px; }
.chipx button:hover { background: var(--card); }
.table { overflow: auto; min-height: 0; }
table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
th, td { height: 31px; padding: 0 10px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
th { position: sticky; top: 0; z-index: 1; background: var(--side); color: var(--quiet); font-weight: 500; }
th .ty { font-family: var(--mono); color: var(--faint); margin-right: 6px; font-size: 11px; }
th.w { background: var(--sky-wash); color: var(--sky); }
td { color: var(--ink); }
td.n, th.n { color: var(--faint); width: 44px; text-align: right; position: sticky; left: 0; background: var(--bg); z-index: 1; }
th.n { z-index: 2; background: var(--side); }
tr:hover td { background: var(--hover); }
tr.off td { color: var(--faint); }
td.w { background: color-mix(in srgb, var(--sky-wash) 45%, transparent); }
.gtabs { display: flex; align-items: center; gap: 4px; padding: 0 10px; border-top: 1px solid var(--rule); }
.gtab { height: 26px; padding: 0 10px; border-radius: 6px; color: var(--quiet); }
.gtab:hover { background: var(--hover); }
.gtab.on { background: var(--card); color: var(--ink); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.gtab small { color: var(--faint); margin-left: 5px; }

/* inspector */
.insp { border-left: 1px solid var(--rule); background: var(--bg); overflow: auto; display: none; }
.inspect .insp { display: block; }
.ih { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 12px; border-bottom: 1px solid var(--rule); }
.ih .ic { width: 28px; height: 28px; border-radius: 7px; background: var(--hover); display: grid; place-items: center; flex: none; }
.ih .ic svg { width: 14px; height: 14px; shape-rendering: crispEdges; }
.ih h2 { margin: 0; color: var(--ink); font-size: 14.5px; font-weight: 600; }
.ih .sub { color: var(--quiet); font-size: 12px; }
.ih .x { margin-left: auto; color: var(--faint); width: 26px; height: 26px; border-radius: 6px; font-size: 16px; }
.ih .x:hover { background: var(--hover); color: var(--ink); }
.sec { padding: 12px 14px; border-bottom: 1px solid var(--rule); }
.sec h4 { margin: 0 0 8px; font-size: 11.5px; font-weight: 500; color: var(--faint); }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; }
.kv dt { color: var(--quiet); } .kv dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.box { background: var(--side); border: 1px solid var(--rule); border-radius: 7px; padding: 8px 10px; color: var(--ink); white-space: pre-wrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { border: 1px solid var(--rule); border-radius: 7px; padding: 6px 8px; }
.stat b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { color: var(--faint); font-size: 11px; }
.row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--quiet); }
.note { color: var(--faint); font-size: 12px; padding: 12px 14px; }
.lesson { padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.lesson .t { color: var(--ink); }
.lesson .m { color: var(--faint); font-size: 11.5px; margin-top: 2px; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app, .app.inspect { grid-template-columns: 1fr; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--rule); }
  .nav { display: flex; gap: 4px; overflow-x: auto; flex: none; }
  .label, .foot { display: none; }
  .item { width: auto; white-space: nowrap; }
  .main { grid-template-rows: auto 60vh 0 auto; }
  .top { flex-wrap: wrap; padding: 8px 12px; gap: 6px; }
  .grid { height: 60vh; }
  .insp { border-left: 0; border-top: 1px solid var(--rule); }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="ws"><div class="logo">g</div><b id="company">Gluely</b></div>
    <div class="nav" id="nav"></div>
    <div class="foot" id="foot"><span class="dot"></span><span id="live">Watching your files</span><button id="theme" title="Light or dark">◐</button></div>
  </aside>
  <section class="main" id="main">
    <div class="top" id="top"></div>
    <div class="canvas" id="canvas"></div>
    <div class="split" id="split" title="Drag to resize"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="insp" id="insp"></aside>
</div>
<script>
// Everything here comes from your files. Prospect text is data, so it is only ever set as text.
const S = { state: null, raw: '', play: null, step: null, run: null, runs: {}, tab: 'all', q: '', zoom: 1, panel: null };
const saved = (() => { try { return JSON.parse(localStorage.getItem('gluely-studio-2') || '{}'); } catch { return {}; } })();
Object.assign(S, { play: saved.play ?? null, run: saved.run ?? null, zoom: saved.zoom ?? 1 });
const keep = () => { try { localStorage.setItem('gluely-studio-2', JSON.stringify({ play: S.play, run: S.run, zoom: S.zoom, grid: saved.grid, theme: saved.theme })); } catch {} };
if (saved.theme) document.documentElement.dataset.theme = saved.theme;
if (saved.grid) document.getElementById('main').style.setProperty('--grid', saved.grid);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const $ = (id) => document.getElementById(id);
const cur = () => { const c = S.state?.currency || '$'; return c.length > 1 ? `${c} ` : c; };
const money = (v) => (v === null || v === undefined ? '?' : `${cur()}${Number(v).toFixed(3).replace(/(\.\d\d)0$/, '$1')}`);
const words = (s) => String(s || '').replace(/_/g, ' ');
const nice = (id) => String(id || '').replace(/[-_]/g, ' ').replace(/^./, (c) => c.toUpperCase());
const tone = (status) => (/^(done|active|found|pass|clear|answered|routed|set|through)$/.test(status) ? 'ok' : /^waiting|needs|too_early|no_results|empty|skipped|retry/.test(status) ? 'wait' : /^(stopped|killed|error|held|out|kill|dropped|ended|over_ceiling|invalid|maybe_sent)$/.test(status) ? 'no' : '');
const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'now' : m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };

const PIX = {
  guard: ['..XXXX..', '.XXXXXX.', 'XX.XX.XX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...'],
  filter: ['XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...', '...XX...', '...XX...', '...XX...'],
  tool: ['...XX...', '..XXXX..', '.XX..XX.', 'XX....XX', 'XX....XX', '.XX..XX.', '..XXXX..', '...XX...'],
  agent: ['......XX', '.....XXX', '....XXX.', '...XXX..', '..XXX...', '.XXX....', 'XXX.....', 'XX......'],
  approve: ['........', '.......X', '......XX', '.....XX.', 'X...XX..', 'XX.XX...', '.XXX....', '..X.....'],
  branch: ['...XX...', '...XX...', '...XX...', '..XXXX..', '.XX..XX.', 'XX....XX', 'X......X', 'X......X'],
  play: ['........', '.XXXXXX.', '.X....X.', '.XXXXXX.', '.X....X.', '.XXXXXX.', '.X....X.', '.XXXXXX.'],
  set: ['XXXX....', 'XXXXX...', 'XX.XXX..', 'XXXXXXX.', '.XXXXXXX', '..XXX.XX', '...XXXXX', '....XXXX'],
  stop: ['..XXXX..', '.XXXXXX.', 'XXXXXXXX', 'XX....XX', 'XX....XX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..'],
};
const HUE = { play: 'var(--faint)', guard: 'var(--sky)', filter: 'var(--quiet)', tool: 'var(--ink)', agent: 'var(--sky)', approve: 'var(--ok)', branch: 'var(--route)', set: 'var(--quiet)', stop: 'var(--no)' };
function pixel(type) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 8 8');
  (PIX[type] || PIX.tool).forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== 'X') return;
    const r = document.createElementNS(ns, 'rect');
    for (const [k, v] of Object.entries({ x, y, width: 1, height: 1, fill: HUE[type] || 'var(--ink)' })) r.setAttribute(k, v);
    svg.append(r);
  }));
  return svg;
}

// ---------- data ----------
async function load() {
  try {
    const raw = await (await fetch('/api/state', { cache: 'no-store' })).text();
    $('foot').classList.remove('off'); $('live').textContent = 'Watching your files';
    if (raw === S.raw) return;
    S.raw = raw; S.state = JSON.parse(raw); S.runs = {};
    if (!S.state.plays.some((p) => p.id === S.play)) S.play = (S.state.plays.find((p) => p.steps.length) || S.state.plays[0])?.id || null;
    await ensureRun(); render();
  } catch { $('foot').classList.add('off'); $('live').textContent = 'Studio stopped'; }
}
const playRuns = () => (S.state?.runs || []).filter((r) => r.play === S.play);
async function ensureRun() {
  const runs = playRuns();
  if (!runs.some((r) => r.id === S.run)) S.run = runs[0]?.id || null;
  if (S.run && !S.runs[S.run]) { try { S.runs[S.run] = await (await fetch(`/api/runs/${S.run}`, { cache: 'no-store' })).json(); } catch {} }
}
const select = async (patch) => { Object.assign(S, patch); keep(); await ensureRun(); render(); };
const play = () => S.state?.plays.find((p) => p.id === S.play);
const run = () => S.runs[S.run];

// ---------- render ----------
function render() {
  if (!S.state) return;
  $('company').textContent = S.state.company;
  renderNav(); renderTop(); renderCanvas(); renderGrid(); renderInspector();
}

function renderNav() {
  const nav = $('nav'); nav.replaceChildren(h('div', { class: 'label' }, 'Plays'));
  for (const p of S.state.plays) {
    nav.append(h('button', { class: `item ${p.id === S.play ? 'on' : ''}`, onclick: () => select({ play: p.id, step: null, run: null, panel: null, tab: 'all' }) },
      h('span', { class: 'glyph' }, pixel('play')), h('span', { class: 't' }, p.name || p.id),
      p.status === 'active' ? h('span', { class: 'dot ok', title: 'active' }) : null));
  }
  const waiting = S.state.runs.filter((r) => String(r.status).startsWith('waiting'));
  if (waiting.length) {
    nav.append(h('div', { class: 'label' }, 'Waiting for you'));
    for (const r of waiting) nav.append(h('button', { class: 'item', onclick: () => select({ play: r.play, run: r.id, step: r.at_step, tab: 'all' }) },
      h('span', { class: 'dot wait' }), h('span', { class: 't' }, r.play), h('small', {}, words(r.status).replace('waiting ', '').replace('spend ', ''))));
  }
  if (S.state.runs.length) {
    nav.append(h('div', { class: 'label' }, 'Recent runs'));
    for (const r of S.state.runs.slice(0, 10)) nav.append(h('button', { class: `item ${r.id === S.run ? 'on' : ''}`, onclick: () => select({ play: r.play, run: r.id }) },
      h('span', { class: `dot ${r.status === 'done' ? 'ok' : String(r.status).startsWith('waiting') ? 'wait' : r.status === 'running' ? 'run' : 'no'}` }),
      h('span', { class: 't mono', style: { fontSize: '12px' } }, r.id), h('small', {}, ago(r.created))));
  }
}

function renderTop() {
  const p = play(); const r = run(); const top = $('top'); top.replaceChildren();
  if (!p) return;
  top.append(h('span', { class: 'crumb' }, 'Plays ', h('span', { class: 'sep' }, '/ '), h('b', {}, p.name || p.id)), h('span', { class: `pill ${tone(p.status)}` }, p.status));
  top.append(h('span', { class: 'spacer' }));
  if (r && String(r.status).startsWith('waiting')) {
    const cmd = r.status === 'waiting_agent' ? `gluely runs next ${r.id}` : `gluely runs approve ${r.id}`;
    const say = { waiting_agent: `Waiting for your agent at ${nice(r.at_step)}`, waiting_approval: `${r.live} rows wait for your yes`, waiting_spend_approval: `Approve up to ${money(r.ceiling)}` }[r.status];
    const code = h('code', { title: 'Click to copy' }, cmd);
    code.addEventListener('click', async () => { try { await navigator.clipboard.writeText(cmd); code.textContent = 'Copied'; setTimeout(() => { code.textContent = cmd; }, 1100); } catch {} });
    top.append(h('span', { class: 'waitbar' }, say, code));
  }
  const runs = playRuns();
  if (runs.length) {
    const sel = h('select', { class: 'btn', onchange: (e) => select({ run: e.target.value }) }, runs.map((x) => { const o = h('option', { value: x.id }, `${x.id} · ${words(x.status)} · ${ago(x.created)}`); if (x.id === S.run) o.selected = true; return o; }));
    top.append(sel);
  }
  top.append(h('button', { class: 'btn', onclick: () => select({ panel: S.panel === 'learn' ? null : 'learn', step: null }) }, 'Learnings', h('small', {}, p.lessons.length)));
}

// ---------- canvas ----------
const traceOf = () => Object.fromEntries((run()?.trace || []).map((t) => [t.step, t]));
const label = (s) => {
  if (s.type === 'tool') return `${(s.try || []).map((t) => t.tool).filter(Boolean).join(' → ') || 'Tool'} · ${s.job || ''}`;
  return { guard: 'Guard · exclusions', filter: 'Filter', agent: 'Agent · your agent', approve: 'Approve · a person', set: 'Set', stop: 'Stop', branch: 'Route' }[s.type] || s.type;
};
const subline = (s) => {
  if (s.type === 'filter') return s.if;
  if (s.type === 'agent') return `writes ${s.writes}`;
  if (s.type === 'tool') return s.writes ? `fills ${s.writes}` : (s.sends || s.job === 'outreach') ? 'sends' : '';
  if (s.type === 'set') return Object.keys(s.values || {}).map((k) => `${k} = …`).join(', ');
  if (s.type === 'stop') return s.reason;
  if (s.type === 'guard') return 'customers and known people stop';
  if (s.type === 'approve') return 'reads every row, says yes';
  return '';
};

function nodeEl(s, num, tr, r) {
  const t = tr[s.id];
  const here = r && r.at_step === s.id && String(r.status).startsWith('waiting');
  const sends = s.type === 'tool' && (s.sends || s.job === 'outreach');
  return h('button', { class: `node ${S.step === s.id ? 'sel' : ''} ${here ? 'here' : ''} ${r && t && !t.reached ? 'dim' : ''}`, title: s.ask || s.if || s.reason || '', onclick: (e) => { e.stopPropagation(); select({ step: S.step === s.id ? null : s.id, panel: null, tab: 'all' }); } },
    h('div', { class: 'nh' }, pixel(s.type), h('span', { class: 'k' }, label(s)), h('span', { class: 'n' }, num)),
    h('div', { class: 'nt' }, nice(s.id), sends ? h('span', { class: 'sends' }, ' · sends') : null),
    subline(s) ? h('div', { class: 'ns' }, subline(s)) : null,
    t && t.reached ? h('div', { class: 'nf' },
      h('span', { class: 'pill' }, `${t.in} in`),
      t.stopped ? h('span', { class: 'pill no' }, `${t.stopped} stopped`) : null,
      t.calls ? h('span', { class: 'pill' }, `${t.calls} calls${t.cost ? ` · ${money(t.cost)}` : ''}`) : null,
      t.errors ? h('span', { class: 'pill no' }, `${t.errors} errors`) : null,
      here ? h('span', { class: 'pill wait' }, 'waiting') : null) : null);
}

function edge(text, drop, arrow = true) {
  return h('div', { class: `edge ${arrow ? 'arrow' : ''}` }, text !== null && text !== undefined ? h('span', { class: 'lab' }, h('span', { class: 'pill' }, text)) : null, drop ? h('span', { class: 'drop' }, h('span', { class: 'pill no' }, drop)) : null);
}

function column(steps, tr, r, counter) {
  const col = h('div', { class: 'col' });
  let prev = null;
  for (const s of steps) {
    if (!s || typeof s !== 'object') continue;
    if (prev) {
      const pt = tr[prev.id];
      const passed = prev.type === 'branch' ? null : pt && pt.reached ? pt.in - pt.stopped : null;
      col.append(edge(passed === null ? null : `${passed}`, prev.type !== 'branch' && pt?.stopped ? `−${pt.stopped}` : null));
    }
    counter.n += 1;
    if (s.type === 'branch') col.append(router(s, counter.n, tr, r, counter));
    else col.append(nodeEl(s, counter.n, tr, r));
    prev = s;
  }
  return col;
}

function router(s, num, tr, r, counter) {
  const t = tr[s.id];
  const paths = s.paths || [];
  const box = h('div', { class: `router ${S.step === s.id ? 'sel' : ''}` },
    h('div', { class: 'rh' }, h('span', { class: 'glyph' }, pixel('branch')),
      h('span', { class: 'name', onclick: () => select({ step: S.step === s.id ? null : s.id, panel: null, tab: 'all' }) }, nice(s.id)),
      h('span', { class: 'pill' }, `${paths.length} paths`), t && t.reached ? h('span', { class: 'pill' }, `${t.in} in`) : null,
      h('span', { class: 'spacer', style: { flex: 1 } }), h('span', { class: 'mono', style: { fontSize: '10.5px', color: 'var(--faint)' } }, num)));
  const grid = h('div', { class: `paths ${paths.length < 2 ? 'one' : ''}`, style: { '--n': String(paths.length) } });
  grid.style.setProperty('--n', String(paths.length));
  for (const p of paths) {
    const count = t?.paths ? t.paths[p.name] ?? 0 : null;
    const col = h('div', { class: 'path' },
      h('div', { class: 'edge', style: { height: '12px' } }),
      h('span', { class: 'plabel', title: p.when ? `when ${p.when}` : 'everyone else' }, h('span', { class: 'pill' }, p.name, count !== null ? ` · ${count}` : '')),
      h('div', { class: 'when' }, p.when ? p.when : 'everyone else'),
      h('div', { class: 'edge arrow', style: { height: '16px' } }));
    if (p.steps.length) col.append(column(p.steps, tr, r, counter));
    col.append(h('div', { class: 'grow' }));
    grid.append(col);
  }
  box.append(grid);
  return box;
}

function renderCanvas() {
  const p = play(); const c = $('canvas');
  const old = c.querySelector('.scroller');
  const pos = old && c.dataset.play === S.play ? [old.scrollLeft, old.scrollTop] : null;
  c.dataset.play = S.play || '';
  c.replaceChildren();
  if (!p) { c.append(h('div', { class: 'empty' }, h('h2', {}, 'No plays yet'), h('p', {}, 'Start one in your terminal: gluely plays start'))); return; }
  if (!p.steps.length) {
    c.append(h('div', { class: 'empty' }, h('h2', {}, 'No workflow yet'), h('p', {}, `Add one to ${p.file}, or ask your agent to. This redraws when the file changes.`),
      h('pre', {}, 'workflow:\n  steps:\n    - { id: guard, type: guard }\n    - { id: fit, type: filter, if: "employees >= 10" }\n    - { id: note, type: agent, ask: Write one honest line, writes: note }\n    - { id: review, type: approve }'), h('p', {}, 'The format is in docs/workflows.md.')));
    return;
  }
  const r = run(); const tr = traceOf();
  const stage = h('div', { class: 'stage', style: { transform: `scale(${S.zoom})` } });
  const col = column(p.steps, tr, r, { n: 0 });
  const lastTop = p.steps[p.steps.length - 1];
  const lt = tr[lastTop?.id];
  if (r) {
    const out = r.status === 'done' ? r.live : null;
    col.append(edge(lt && lastTop.type !== 'branch' && lt.reached ? `${lt.in - lt.stopped}` : null, null), h('div', { class: 'end' }, r.status === 'done' ? h('span', {}, h('b', {}, out), ' rows out') : h('span', {}, h('b', {}, r.live), ` of ${r.rows} still in`), h('div', { class: 'mono', style: { fontSize: '10.5px', color: 'var(--faint)' } }, r.status === 'done' ? r.out : words(r.status))));
  }
  stage.append(col);
  const scroller = h('div', { class: 'scroller' }, stage);
  c.append(scroller);
  if (pos) { scroller.scrollLeft = pos[0]; scroller.scrollTop = pos[1]; }
  const zoom = (z) => { S.zoom = Math.max(0.4, Math.min(1.6, Math.round(z * 10) / 10)); keep(); stage.style.transform = `scale(${S.zoom})`; };
  c.append(h('div', { class: 'zoom' }, h('button', { title: 'Zoom in', onclick: () => zoom(S.zoom + 0.1) }, '+'), h('button', { title: 'Zoom out', onclick: () => zoom(S.zoom - 0.1) }, '−'),
    h('button', { title: 'Fit the whole workflow', onclick: () => { const w = c.clientWidth / (col.scrollWidth + 80); const hh = c.clientHeight / (col.scrollHeight + 90); zoom(Math.min(1, w, hh)); scroller.scrollTo(0, 0); } }, '⤢')));
  scroller.onclick = (e) => { if (e.target === scroller || e.target === stage) select({ step: null }); };
}

// ---------- grid ----------
function reached(rec, stepIndex, flat, upTo) {
  const s = flat[stepIndex];
  if (!s || stepIndex > upTo) return false;
  if (!s.scope.every((x) => rec.route?.[x.branch] === x.path)) return false;
  if (!rec.stopped) return true;
  const at = flat.findIndex((f) => f.id === rec.stopped.step);
  return at >= stepIndex;
}

function writesOf(step) {
  if (!step) return [];
  if (step.type === 'tool') return (step.try || []).flatMap((t) => Object.keys(t.pick || {}));
  if (step.type === 'agent') return [step.writes];
  if (step.type === 'set') return Object.keys(step.values || {});
  return [];
}

function findStep(steps, id) {
  for (const s of steps || []) {
    if (s?.id === id) return s;
    for (const p of s?.paths || []) { const f = findStep(p.steps, id); if (f) return f; }
  }
  return null;
}

function renderGrid() {
  const g = $('grid'); g.replaceChildren();
  const p = play(); const r = run();
  if (!p || !r || !r.records) { g.append(h('div', { class: 'gbar' }, h('span', { class: 'count' }, p?.steps.length ? 'No run yet. The rows of a run show here.' : '')), h('div'), h('div')); return; }
  const flat = p.flat || [];
  const upTo = r.status === 'done' ? flat.length : (r.step_index ?? flat.length);
  const stepIdx = S.step ? flat.findIndex((f) => f.id === S.step) : -1;
  const step = S.step ? findStep(p.steps, S.step) : null;
  let rows = r.records;
  if (stepIdx >= 0) rows = rows.filter((x) => reached(x, stepIdx, flat, upTo));
  const counts = { all: rows.length, through: rows.filter((x) => !x.stopped).length, stopped: rows.filter((x) => x.stopped).length };
  if (S.tab === 'through') rows = rows.filter((x) => !x.stopped);
  if (S.tab === 'stopped') rows = rows.filter((x) => x.stopped);
  const q = S.q.trim().toLowerCase();
  if (q) rows = rows.filter((x) => Object.values(x.data).some((v) => String(v).toLowerCase().includes(q)));
  const cols = [...new Set(r.records.flatMap((x) => Object.keys(x.data)))];
  const hot = new Set(writesOf(step));

  const search = h('input', { placeholder: 'Search rows', value: S.q });
  search.addEventListener('input', (e) => { S.q = e.target.value; renderGridBody(); });
  const bar = h('div', { class: 'gbar' }, search,
    step ? h('span', { class: 'chipx' }, `Rows that reached ${nice(step.id)}`, h('button', { title: 'Show all rows', onclick: () => select({ step: null }) }, '×')) : null,
    h('span', { class: 'spacer', style: { flex: 1 } }), h('span', { class: 'count', id: 'gcount' }, `${rows.length} rows`),
    h('button', { class: 'btn', title: 'Download these rows as CSV', onclick: () => download(rows, cols) }, '↓ CSV'));
  const body = h('div', { class: 'table', id: 'gbody' });
  const tabs = h('div', { class: 'gtabs' }, [['all', 'All rows'], ['through', 'Still in'], ['stopped', 'Stopped']].map(([id, name]) => h('button', { class: `gtab ${S.tab === id ? 'on' : ''}`, onclick: () => select({ tab: id }) }, name, h('small', {}, counts[id]))));
  g.append(bar, body, tabs);

  function renderGridBody() {
    let shown = rows;
    const qq = S.q.trim().toLowerCase();
    if (qq !== q) shown = (stepIdx >= 0 ? r.records.filter((x) => reached(x, stepIdx, flat, upTo)) : r.records)
      .filter((x) => (S.tab === 'through' ? !x.stopped : S.tab === 'stopped' ? x.stopped : true))
      .filter((x) => !qq || Object.values(x.data).some((v) => String(v).toLowerCase().includes(qq)));
    $('gcount').textContent = `${shown.length} rows`;
    const numeric = (c) => r.records.every((x) => x.data[c] === undefined || x.data[c] === '' || Number.isFinite(Number(x.data[c])));
    body.replaceChildren(h('table', {},
      h('thead', {}, h('tr', {}, h('th', { class: 'n' }, '#'), cols.map((c) => h('th', { class: hot.has(c) ? 'w' : '' }, h('span', { class: 'ty' }, numeric(c) ? '#' : 'T'), c)), h('th', {}, 'Outcome'))),
      h('tbody', {}, shown.map((x) => h('tr', { class: x.stopped ? 'off' : '' }, h('td', { class: 'n' }, x.n),
        cols.map((c) => h('td', { class: hot.has(c) ? 'w' : '', title: String(x.data[c] ?? '') }, x.data[c] ?? '')),
        h('td', { title: x.stopped?.reason || '' }, x.stopped ? h('span', {}, h('span', { class: 'pill no' }, nice(x.stopped.step)), ' ', h('span', { style: { color: 'var(--quiet)' } }, x.stopped.reason)) : h('span', { class: 'pill ok' }, r.status === 'done' ? 'through' : 'in')))))));
  }
  renderGridBody();
}

function download(rows, cols) {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const text = [[...cols, 'stopped_at', 'stopped_why'], ...rows.map((x) => [...cols.map((c) => x.data[c]), x.stopped?.step, x.stopped?.reason])].map((row) => row.map(cell).join(',')).join('\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/csv' })), download: `${S.run}${S.step ? `-${S.step}` : ''}.csv` });
  document.body.append(a); a.click(); a.remove();
}

// ---------- inspector ----------
function renderInspector() {
  const insp = $('insp'); const p = play(); const r = run();
  const step = p && S.step ? findStep(p.steps, S.step) : null;
  $('app').classList.toggle('inspect', Boolean(step || S.panel === 'learn'));
  insp.replaceChildren();
  if (S.panel === 'learn' && p) { renderLearn(insp, p); return; }
  if (!step) return;
  const t = r?.trace?.find((x) => x.step === step.id);
  insp.append(h('div', { class: 'ih' }, h('div', { class: 'ic' }, pixel(step.type)), h('div', {}, h('h2', {}, nice(step.id)), h('div', { class: 'sub' }, label(step))), h('button', { class: 'x', title: 'Close', onclick: () => select({ step: null }) }, '×')));
  const kv = [];
  if (step.job) kv.push(['Job', step.job]);
  if (step.writes) kv.push(['Writes', step.writes]);
  if (step.if) kv.push(['Keeps', step.if]);
  if (step.check) kv.push(['Checked', `${step.check} voice rules`]);
  if (step.required) kv.push(['Required', 'rows it can’t fill stop here']);
  if (step.reason) kv.push(['Reason', step.reason]);
  if (step.values) for (const [k, v] of Object.entries(step.values)) kv.push([k, String(v)]);
  if (kv.length) insp.append(h('div', { class: 'sec' }, h('h4', {}, 'Setup'), h('dl', { class: 'kv' }, kv.flatMap(([a, b]) => [h('dt', {}, a), h('dd', {}, b)]))));
  if (step.ask) insp.append(h('div', { class: 'sec' }, h('h4', {}, 'Your agent is asked'), h('div', { class: 'box' }, step.ask)));
  if (step.type === 'guard') insp.append(h('div', { class: 'sec' }, h('div', { class: 'box' }, 'Every row is checked against context/exclusions. Customers are held, known people go to their owner, and only clear rows reach a tool.')));
  if (step.type === 'approve') insp.append(h('div', { class: 'sec' }, h('div', { class: 'box' }, 'The run waits here until a person reads every row in a terminal and types yes. Rows can be rejected with --reject 2,5.')));
  if (step.type === 'branch') insp.append(h('div', { class: 'sec' }, h('h4', {}, 'Paths, in order'), (step.paths || []).map((x, j) => h('div', { class: 'row' }, h('span', { class: 'pill' }, `${j + 1}. ${x.name}`), h('span', { class: 'grow mono', style: { fontSize: '11.5px' } }, x.when || 'everyone else'), t?.paths ? h('span', { class: 'pill' }, t.paths[x.name] ?? 0) : null)), h('div', { class: 'note', style: { padding: '8px 0 0' } }, 'Each row takes the first path that fits. Then everyone still in goes on together.')));
  if (step.try) insp.append(h('div', { class: 'sec' }, h('h4', {}, step.try.length > 1 ? 'Waterfall' : 'Tool'), step.try.map((x, j) => h('div', { class: 'row' }, h('span', { class: 'pill' }, j + 1), h('span', { style: { color: 'var(--ink)' } }, x.tool), h('span', { class: 'grow mono', style: { fontSize: '11px' } }, `${x.method} ${x.host}`), h('span', { class: `pill ${x.price === null ? 'no' : ''}` }, x.price === null ? 'no price' : money(x.price))))));
  if (step.keys?.length) insp.append(h('div', { class: 'sec' }, h('h4', {}, 'Keys in .env'), step.keys.map((k) => h('div', { class: 'row' }, h('span', { class: `pill ${k.set ? 'ok' : 'no'}` }, k.set ? 'set' : 'missing'), h('span', { class: 'mono', style: { fontSize: '12px', color: 'var(--ink)' } }, k.name)))));
  if (t && t.reached) insp.append(h('div', { class: 'sec' }, h('h4', {}, `In ${r.id}`), h('div', { class: 'stats' }, [['in', t.in], ['stopped', t.stopped], ['calls', t.calls], ['cost', money(t.cost)]].map(([k, v]) => h('div', { class: 'stat' }, h('b', {}, v), h('span', {}, k))))));
  const events = (r?.events || []).filter((e) => e.step === step.id).slice(-30).reverse();
  if (events.length) insp.append(h('div', { class: 'sec' }, h('h4', {}, 'Latest rows'), events.map((e) => h('div', { class: 'row', title: [e.tool, e.http && `HTTP ${e.http}`, e.ms && `${e.ms}ms`, e.reason, e.error, e.path].filter(Boolean).join(' · ') },
    h('span', { class: 'mono', style: { color: 'var(--faint)', width: '30px' } }, `#${e.row}`), h('span', { class: `pill ${tone(e.status)}` }, words(e.status)),
    h('span', { class: 'grow' }, [e.path, e.tool, e.http && `HTTP ${e.http}`, e.ms && `${e.ms}ms`, e.reason || e.error].filter(Boolean).join(' · '))))));
  insp.append(h('div', { class: 'note' }, `Change this step in ${p.file}. The studio redraws when the file changes.`));
}

function renderLearn(insp, p) {
  insp.append(h('div', { class: 'ih' }, h('div', {}, h('h2', {}, 'Learnings'), h('div', { class: 'sub' }, 'What this play produced, and what changed')), h('button', { class: 'x', title: 'Close', onclick: () => select({ panel: null }) }, '×')));
  const res = p.results;
  if (res) insp.append(h('div', { class: 'sec' }, h('div', { class: 'row' }, h('span', { class: `pill ${tone(res.verdict)}` }, words(res.verdict))), h('div', { style: { color: 'var(--ink)', marginTop: '4px' } }, res.why),
    res.batches ? h('div', { style: { color: 'var(--faint)', fontSize: '12px', marginTop: '4px' } }, `${res.totals.touches} touches · ${res.totals.replies} replies · ${res.totals.positive} positive · ${res.totals.meetings} meetings`) : null));
  if (!p.lessons.length) insp.append(h('div', { class: 'note' }, 'No lessons for this play yet. Decisions and corrections land here as you work.'));
  for (const l of p.lessons) insp.append(h('div', { class: 'lesson' }, h('div', { class: 't' }, l.after ? `${l.before} → ${l.after}` : l.text), h('div', { class: 'm' }, [l.kind, l.area, l.by, l.at?.slice(0, 10)].filter(Boolean).join(' · '), l.why ? ` · because ${l.why}` : '')));
}

// ---------- chrome ----------
$('theme').onclick = () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; saved.theme = next; keep(); };
$('split').addEventListener('mousedown', (e) => {
  e.preventDefault();
  const main = $('main'); const box = main.getBoundingClientRect();
  const move = (ev) => { const pct = Math.max(18, Math.min(75, ((box.bottom - ev.clientY) / box.height) * 100)); main.style.setProperty('--grid', `${pct}%`); saved.grid = `${pct}%`; };
  const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); keep(); };
  window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') select({ step: null, panel: null }); });
load();
setInterval(load, 2000);
</script>
