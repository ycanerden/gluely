id: play-id
status: draft
priority: 50
hypothesis: >
  One testable sentence: who, why now, and what you expect to happen.
signal:
  type: signal.post_engagement
  source: any tool you like
  window_days: 14
audience:
  personas: []
  icp_band: [hot, warm]
excuse:
  angle: What makes reaching out honest and useful
  variants: [a]
  # Proof ids from context/proof/. An active play can only cite repeated or measured proof.
  proof: []
action:
  channels: [email]
  tool: any tool you like
success:
  primary: meeting_booked
# Time first: at startup volume a touch count is noise, and 100 touches can take years.
# Switch to after_touches only when you send hundreds a month.
kill:
  after_days: 90
  if: "meetings == 0"
