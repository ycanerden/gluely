# The tool library. Listed alphabetically on purpose: Gluely ranks nobody.
# Add a tool with a pull request, or to your own workspace with `gluely tools add`.
# Vendors change often, so check each tool's terms and pricing before you commit.

jobs:
  person-data: Check people and job moves
  signal-data: Collect posts, engagers and followers
  hiring-data: Find companies that are hiring
  contact-data: Find emails and phone numbers
  email-verify: Verify emails
  outreach: Send messages
  crm: Keep deals and relationships
  store: Hold the data
  transcripts: Record calls, with consent
  product-data: See what users do in your product
  forms: Capture inbound
  booking: Book meetings
  agent: Do the thinking

access:
  own-data: Your own data
  database: A vendor's dataset
  aggregator: Many data providers in one tool
  scraper: Scrapes public pages, so check the terms and your legal basis
  your-account: Works through your logged-in account, so keep volumes low
  software: Software you run or use

tools:
  - { name: Amplitude, jobs: [product-data], access: software }
  - { name: Apify, jobs: [person-data, signal-data, hiring-data], access: scraper }
  - { name: Apollo, jobs: [person-data, contact-data, outreach], access: database }
