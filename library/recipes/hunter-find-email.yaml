tool: Hunter
job: contact-data
what: Find a work email from a first name, last name and company domain
docs: https://hunter.io/api-documentation/v2#email-finder
request:
  method: GET
  url: https://api.hunter.io/v2/email-finder?domain={{row.domain}}&first_name={{row.first_name}}&last_name={{row.last_name}}
  headers: { x-api-key: "{{env.HUNTER_KEY}}" }
pick: { email: data.email, email_score: data.score }
writes: email
tested: null
